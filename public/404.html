<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Parc numérique</title>
    <!-- Redirige les routes profondes vers index.html en encodant le chemin (routage SPA GitHub Pages) -->
    <script>
      (function (l) {
        var pathSegmentsToKeep = 1 // nom du dépôt projet : /parc-numerique/
        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
        )
      })(window.location)
    </script>
  </head>
  <body></body>
</html>
